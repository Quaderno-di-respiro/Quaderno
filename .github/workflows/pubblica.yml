# Pubblica il Quaderno su GitHub Pages, cifrato con gli accessi personali: un segreto per
# persona col nome che inizia con ACCESSO_ (più PASSWORD e PASSWORDS, se ci sono ancora).
# Parte da solo a ogni aggiornamento dei file; dopo aver aggiunto o cancellato un accesso si
# lancia a mano da Actions → Pubblica → Run workflow.
name: Pubblica

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cifra la guida con gli accessi
        run: node strumenti/cifra.js
        env:
          CHIAVE_SORGENTE: ${{ secrets.CHIAVE_SORGENTE }}
          # tutti i segreti: cifra.js usa solo quelli che iniziano con ACCESSO_
          SEGRETI: ${{ toJSON(secrets) }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pagine.outputs.page_url }}
    steps:
      - id: pagine
        uses: actions/deploy-pages@v4
